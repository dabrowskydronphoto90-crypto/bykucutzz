<style>
/* Układ: ekran telefonu, nagłówek z postępem, stos ekranów, dolny pasek z ceną. Jeden ciemny look marki. */
:root{
  --ink:#0a0b0d; --card:#15171a; --card2:#1d2024; --line:rgba(255,255,255,.08);
  --fg:#f3f5f6; --mute:#8b9298; --blue:#61ccf0; --blue-ink:#032430; --red:#e5322d; --star:#ec6a3c;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:#050506;color:var(--fg);font-family:var(--f);font-variation-settings:"wdth" 100;-webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum";overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wide{font-variation-settings:"wdth" 125}

/* telefon: pełny ekran na komórce, ramka na komputerze */
#app{position:relative;height:100%;width:100%;background:var(--ink);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:560px){
  body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#1a1d21,#050506 70%)}
  #app{width:390px;height:min(844px,calc(100% - 32px));border-radius:48px;box-shadow:0 0 0 10px #1b1d20,0 0 0 11px #2c2f33,0 40px 90px rgba(0,0,0,.6)}
}

/* nagłówek */
#top{flex:none;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px;z-index:5;transition:opacity .3s}
#back{flex:none;height:40px;padding:0 14px 0 9px;border-radius:20px;background:var(--card);display:flex;align-items:center;gap:3px;font-size:14px;font-weight:600;
  transition:transform .2s,opacity .25s,width .3s}
#back:active{transform:scale(.92)}
#back[aria-hidden="true"]{opacity:0;pointer-events:none}
#crumbs{flex:1;min-width:0;display:flex;gap:6px;overflow:hidden;direction:rtl;
  -webkit-mask:linear-gradient(90deg,transparent,#000 14px);mask:linear-gradient(90deg,transparent,#000 14px);padding-left:4px}
.cr{direction:ltr;flex:none;max-width:132px;height:30px;padding:0 11px;border-radius:15px;background:#132027;color:var(--blue);font-size:12px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 0 0 1px rgba(97,204,240,.35)}
.cr:active{transform:scale(.93)}
#top.hide{opacity:0;pointer-events:none}

#stack{position:relative;flex:1;min-height:0}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:4px 18px 130px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
h1{font-size:30px;line-height:1.02;font-weight:800;font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:-.01em;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--mute);font-size:15px;margin:0 0 18px}

/* splash */
#splash{position:absolute;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;cursor:pointer}
#splash img{width:210px;max-width:60%}
#tag{display:flex;gap:.32em;font-weight:800;font-variation-settings:"wdth" 125;font-size:15px;letter-spacing:.14em;color:var(--blue)}
#tag span{display:inline-block;opacity:0}

/* salony */
.salon{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:24px;background:var(--card);margin-bottom:10px;padding:10px 14px 10px 10px;
  box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .3s,background .3s}
.salon.on{box-shadow:inset 0 0 0 2px var(--blue);background:#132027}
.salon .ph{flex:none;width:76px;height:76px;border-radius:18px;background-size:cover;background-position:center}
.salon .meta{flex:1;min-width:0}
.salon .nm{font-size:16px;font-weight:700;letter-spacing:-.01em}
.salon .ad{font-size:13px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.salon .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.salon .rt{font-size:12px;display:inline-flex;align-items:center;gap:4px;font-weight:700}
.salon .rt small{color:var(--mute);font-weight:500}
.salon .pill{padding:4px 8px;font-size:11px}
.salon .chev{flex:none;color:var(--mute)}
.map{position:relative;aspect-ratio:400/330;border-radius:26px;overflow:hidden;background:#0e1013;margin:4px 0 14px;box-shadow:inset 0 0 0 1px var(--line)}
.mz{position:absolute;inset:0;--z:1;transform:scale(var(--z));transition:transform .9s cubic-bezier(.2,1,.3,1),transform-origin .9s cubic-bezier(.2,1,.3,1)}
.mz>svg{position:absolute;inset:0;width:100%;height:100%}
.mz .mp{fill:#14201c;stroke:none}
.mz .mc,.mz .mb,.mz .ma{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mz .mc{stroke:#23272c;stroke-width:1}
.mz .mb{stroke:#353a40;stroke-width:1.8}
.mz .ma{stroke:#4a5057;stroke-width:2.8}
.pin{position:absolute;width:0;height:0;transform:scale(calc(1/var(--z)));transition:transform .9s cubic-bezier(.2,1,.3,1);z-index:2}
.pin .pd{position:absolute;left:-21px;top:-51px;width:42px;height:42px;border-radius:50% 50% 50% 4px;transform-origin:50% 50%;rotate:-45deg;
  background:#f3f5f6;display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.5);transition:background .3s}
.pin .pd svg{rotate:45deg}
.pin.on .pd{background:var(--blue)}
.pin .pr{position:absolute;left:-18px;top:-9px;width:36px;height:18px;border-radius:50%;border:2px solid var(--blue);opacity:0}
.pin.on .pr{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
.pin .pl{position:absolute;top:4px;left:50%;translate:-50% 0;white-space:nowrap;font-size:12px;font-weight:700;padding:4px 9px;border-radius:9px;background:rgba(10,11,13,.82);color:var(--fg)}
.pin.on .pl{color:var(--blue)}
.mapf{position:absolute;right:10px;bottom:6px;font-size:9px;color:#4a5057}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--card2);white-space:nowrap}
.pill.open{color:#7be3a4}.pill.closed{color:#ff8a85}
.pill.demo{position:absolute;top:14px;left:14px;z-index:2;background:rgba(0,0,0,.6);color:var(--mute);backdrop-filter:blur(8px)}
.rate{position:absolute;top:14px;right:14px;z-index:2;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);
  padding:7px 11px;border-radius:99px;font-size:13px;font-weight:700}
.rate small{font-weight:500;color:var(--mute)}
.salon:active{transform:scale(.98)}

/* usługi */
.hero{position:relative;height:200px;margin:0 -18px;background-size:cover;background-position:center}
.spot{position:absolute;inset:0;background:#0e1013;overflow:hidden}
.spot>svg{position:absolute;inset:-6%;width:112%;height:112%;animation:drift 14s ease-in-out infinite alternate}
.spot .mp{fill:#14201c}.spot .mc,.spot .mb,.spot .ma{fill:none;stroke-linecap:round;stroke-linejoin:round}
.spot .mc{stroke:#262a30;stroke-width:1.2}.spot .mb{stroke:#3a4047;stroke-width:2.2}.spot .ma{stroke:#50575f;stroke-width:3.4}
.spot::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(97,204,240,.28),rgba(97,204,240,0) 55%);z-index:1}
.spot .sd{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px #0e1013,0 0 14px rgba(97,204,240,.9);z-index:2}
.spot .sr{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;border:2px solid var(--blue);z-index:2;animation:ring 2.4s ease-out infinite}
.spot .sr+.sr{animation-delay:1.2s}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(6);opacity:0}}
@keyframes drift{0%{transform:translate(-2%,1%) scale(1)}100%{transform:translate(2%,-1.5%) scale(1.06)}}
.salon .ph{position:relative;overflow:hidden}
.hero .spot{bottom:30%;-webkit-mask:linear-gradient(#000 60%,transparent);mask:linear-gradient(#000 60%,transparent)}
.spot .sr,.spot .sd{box-sizing:border-box}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(10,11,13,.1),rgba(10,11,13,1) 96%)}
.hero .ht{position:absolute;left:18px;right:18px;bottom:6px;z-index:2}
.hero .ht h1{margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 12px;padding:0 18px;scrollbar-width:none;position:relative}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;font-weight:600;padding:10px 16px;border-radius:99px;background:var(--card);color:var(--mute);position:relative;z-index:1;transition:color .3s}
.chip.on{color:var(--blue-ink);background:transparent}
#chipInd{position:absolute;top:0;height:100%;border-radius:99px;background:var(--blue);z-index:0}
.svc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:22px;background:var(--card);margin-bottom:10px;
  box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .25s,background .25s}
.svc .t{flex:1;min-width:0}
.svc .n{font-size:16px;font-weight:600}
.svc .d{font-size:13px;color:var(--mute);margin-top:4px}
.svc .p{font-size:17px;font-weight:700;white-space:nowrap}
.tick{flex:none;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px #3a3e43;display:grid;place-items:center;transition:background .25s,box-shadow .25s}
.tick svg{opacity:0;transform:scale(.4);transition:opacity .2s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.svc.on{box-shadow:inset 0 0 0 2px var(--blue);background:#132027}
.svc.on .tick{background:var(--blue);box-shadow:none}
.svc.on .tick svg{opacity:1;transform:none}

/* barberzy */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.brb{position:relative;text-align:center;padding:18px 10px 14px;border-radius:24px;background:var(--card);box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .25s,background .25s}
.brb .av{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;background-size:cover;background-position:center;position:relative;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.brb .av.any{display:grid;place-items:center;background:var(--card2)}
.brb .n{font-size:16px;font-weight:700}
.brb .f{font-size:12px;color:var(--mute);margin-top:4px}
.brb .f b{color:var(--blue);font-weight:600}
.brb .q{font-size:12px;color:var(--mute);margin-top:8px;font-style:italic;min-height:15px}
.brb.on{box-shadow:inset 0 0 0 2px var(--blue);background:#132027}
.brb.on .av{transform:scale(1.08)}
.brb .ring{position:absolute;inset:-5px;border-radius:50%;box-shadow:0 0 0 2px var(--blue);opacity:0;transform:scale(.8);transition:all .35s cubic-bezier(.3,1.5,.5,1)}
.brb.on .ring{opacity:1;transform:none}
.note{font-size:13px;color:var(--mute);background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px}

/* barberzy: widżet „Zespół BYKUCUTZZ” jak w filmie (niebieski gradient, zdjęcia wjeżdżają po kolei, licznik + pasek) */
.team{position:relative;border-radius:28px;overflow:hidden;background:#07090b;padding:20px 18px 16px;margin-top:4px}
.team .bl{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse 55% 90% at 12% 100%,rgba(97,204,240,.55) 0%,rgba(97,204,240,0) 70%),linear-gradient(100deg,#15617f 0%,#0d3346 36%,#0a1a22 68%,#07090b 100%)}
.team>*:not(.bl){position:relative}
.team .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.team .tt{font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.team .tt::after{content:"";display:inline-block;width:2px;height:18px;margin-left:2px;vertical-align:-3px;background:#fff;opacity:var(--cur,0)}
.team .chp{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;opacity:0;white-space:nowrap}
.team .avs{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 4px;margin:20px -6px 6px}
.tm{display:flex;flex-direction:column;align-items:center;gap:7px;color:#fff;min-width:0}
.tm .ph{position:relative;width:56px;height:56px;border-radius:50%;background:#1d2024 center/cover;opacity:0;
  box-shadow:0 0 0 3px rgba(255,255,255,.92),0 8px 18px rgba(0,0,0,.35);transition:box-shadow .3s}
.tm .ph.any{display:grid;place-items:center;background:#0d3346}
.tm .nm{font-size:11px;font-weight:500;color:rgba(255,255,255,.86);opacity:0}
.tm .ck{position:absolute;right:-4px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--blue);display:grid;place-items:center;
  box-shadow:0 0 0 3px #0a1a22;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.tm.on .ph{box-shadow:0 0 0 3px var(--blue),0 0 22px rgba(97,204,240,.7)}
.tm.on .ck{transform:none}
.tm.on .nm{color:var(--blue)}
.team .num{display:flex;align-items:baseline;gap:8px;margin-top:12px;opacity:0}
.team .num b{font-size:52px;font-weight:400;letter-spacing:-.03em;line-height:1}
.team .num span{font-size:17px;color:rgba(255,255,255,.78)}
.team .trk{height:7px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:10px;opacity:0}
.team .bar{width:0;height:100%;border-radius:4px;background:linear-gradient(90deg,#3fb6e3,#7fdcff);box-shadow:0 0 10px rgba(97,204,240,.9)}
.team .ft{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:11px;color:rgba(255,255,255,.55)}
.team .ft span{opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick{margin-top:12px;border-radius:22px;background:var(--card);padding:14px 16px;display:flex;gap:14px;align-items:center;min-height:74px}
.pick .pa{flex:none;width:46px;height:46px;border-radius:50%;background:#1d2024 center/cover;display:grid;place-items:center}
.pick .pn{font-size:17px;font-weight:700}
.pick .pq{font-size:12px;color:var(--mute);font-style:italic;margin-top:2px}
.pick .pf{font-size:12px;color:var(--mute);margin-top:4px}
.pick .pf b{color:var(--blue);font-weight:600}
.pick .pp{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.pick .pp b{color:var(--blue)}
.pick.empty{color:var(--mute);font-size:14px;justify-content:center}
/* termin */
.mon{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 10px}
.mon b{font-size:17px;font-weight:700;text-transform:capitalize}
.wk{display:flex;align-items:center;gap:4px;margin:0 -10px 18px}
.arr{flex:none;width:28px;height:76px;display:grid;place-items:center;color:var(--fg);border-radius:12px}
.arr:disabled{color:#3a3e43}
.days{position:relative;flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
#dayInd{position:absolute;top:0;left:0;height:76px;border-radius:16px;background:var(--blue);z-index:0;opacity:0}
.day{min-width:0;height:76px;border-radius:16px;background:var(--card);position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:color .3s,background .3s}
.day .dw{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;transition:color .3s}
.day .dn{font-size:20px;font-weight:700}
.day.x .dn{color:#5a5f65}.day.x .dw{color:var(--red)}
.day.on{background:transparent;color:var(--blue-ink)}
.day.on .dw{color:var(--blue-ink)}
/* bęben godzin jak w iOS (Damian wybrał) */
.wheel{position:relative;height:236px;margin-top:14px;border-radius:24px;background:var(--card);overflow:hidden;touch-action:none;cursor:grab;user-select:none;perspective:900px}
.wheel .wb{position:absolute;left:10px;right:10px;top:50%;height:46px;margin-top:-23px;border-radius:14px;background:#132027;box-shadow:inset 0 0 0 2px var(--blue)}
.wheel .wl{position:absolute;inset:0;transform-style:preserve-3d}
.wheel .wi{position:absolute;left:0;right:0;top:50%;height:46px;margin-top:-23px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg);backface-visibility:hidden}
.wheel .wi.on{color:var(--blue)}
.wheel .wp{position:absolute;right:24px;top:50%;margin-top:-8px;font-size:11px;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;font-weight:600;z-index:2}
.wheel .wq{position:absolute;left:24px;top:50%;margin-top:-8px;font-size:11px;color:rgba(255,255,255,.45);z-index:2}
.wheel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--card),rgba(21,23,26,0) 32%,rgba(21,23,26,0) 68%,var(--card))}
.grp{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{height:46px;border-radius:14px;background:var(--card);font-size:15px;font-weight:600;transition:background .2s,color .2s,transform .2s}
.slot:active{transform:scale(.94)}
.slot.on{background:var(--blue);color:var(--blue-ink)}
.empty{text-align:center;padding:36px 20px;color:var(--mute);background:var(--card);border-radius:24px}
.empty b{display:block;color:var(--fg);font-size:17px;margin:12px 0 4px}

/* podsumowanie — bilet */
/* karta rezerwacji jak przepustka w Apple Wallet, z kodem QR (Damian wybrał ten układ) */
.ticket{position:relative;border-radius:24px;color:var(--fg);overflow:hidden;padding:18px 20px 20px;
  background:radial-gradient(ellipse 80% 55% at 100% 0%,rgba(97,204,240,.35),rgba(97,204,240,0) 70%),linear-gradient(180deg,#0f2a37 0%,#0c1418 46%,#0b0d10 100%);
  box-shadow:inset 0 0 0 1px rgba(97,204,240,.2),0 24px 48px rgba(0,0,0,.5)}
.ticket::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.12) 50%,transparent 65%);transform:translateX(-120%)}
.ticket.shine::after{animation:shine 1.1s .5s cubic-bezier(.4,0,.2,1)}
@keyframes shine{to{transform:translateX(120%)}}
.ticket .k{display:block;font-size:11px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em}
.ticket b{display:block;font-size:16px;font-weight:700;margin-top:3px}
.ps-h{display:flex;justify-content:space-between;align-items:center}
.ps-h img{height:26px;mix-blend-mode:screen}
.ps-h .pd{text-align:right}
.ps-big{margin:16px 0 14px}
.ps-big b{font-size:52px;line-height:1;font-weight:800;font-variation-settings:"wdth" 125;letter-spacing:-.01em;color:var(--blue);text-shadow:0 0 22px rgba(97,204,240,.45);margin-top:6px}
.ps-big .pe{font-size:13px;color:rgba(255,255,255,.55);margin-top:6px;display:block}
.ps-r{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid rgba(255,255,255,.08)}
.ps-r>div:last-child:not(:first-child){text-align:right}
.ps-r .who{display:flex;align-items:center;gap:8px}
.ps-r .who i{width:26px;height:26px;border-radius:50%;background:#0d3346 center/cover;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.ps-r .ad{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}
.ps-q{display:flex;align-items:center;gap:16px;margin-top:6px;padding-top:16px;border-top:1px dashed rgba(255,255,255,.16)}
.ps-q svg{flex:none;width:96px;height:96px}
.ps-q svg rect{fill:#e9f6fb}
.ps-q .qt{font-size:13px;color:rgba(255,255,255,.6);line-height:1.4}
.ps-q .qt b{font-size:15px;color:var(--fg);margin:0 0 2px}
.ps-q .qn{font-family:ui-monospace,monospace;font-size:12px;color:var(--blue);margin-top:6px;letter-spacing:.08em}
.rules{font-size:13px;color:var(--mute);line-height:1.45;margin:16px 2px 0}

/* dolny pasek */
#bar{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:12px;
  padding:10px 10px 10px 18px;border-radius:26px;background:rgba(29,32,36,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 0 0 1px var(--line);transform:translateY(140%);transition:transform .55s cubic-bezier(.2,1.25,.4,1)}
#bar.show{transform:none}
#bar.hold #barInfo{display:none}
#bar.hold #go{flex:1;justify-content:center}
/* krok 4: przycisk „Umów wizytę” — animacja jak „Complete order” (mikedesign) */
#bar.hold{padding:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
#bar.hold #go{--c:#61ccf0;height:62px;border-radius:31px;background:#0c0d0f;color:#f3f5f6;font-size:16px;letter-spacing:.02em;overflow:visible;
  font-variation-settings:"wdth" 125;text-transform:uppercase;transition:transform .15s}
#bar.hold #go .fill{display:none}
#go .co{position:absolute;inset:0;pointer-events:none;display:none}
#bar.hold #go .co{display:block}
#go .co svg.fr{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#go .co .base{fill:none;stroke:rgba(255,255,255,.6);stroke-width:1.5;transition:stroke .3s}
#go .co .pg{fill:none;stroke:var(--c);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 5px var(--c))}
#go .co .road{position:absolute;left:18%;right:18%;top:72%;height:2px;opacity:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 10px,transparent 10px 22px)}
#go .co .ico{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-19px 0 0 -15px;color:var(--c);opacity:0}
#go .co .ok{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;opacity:0}
#glow{position:absolute;left:-20%;right:-20%;bottom:-120px;height:460px;z-index:5;pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,var(--gc,#61ccf0),transparent);mix-blend-mode:screen}
#barInfo{flex:1;min-width:0}
#barT{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barS{font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#go{position:relative;overflow:hidden;height:52px;padding:0 20px;border-radius:18px;background:var(--blue);color:var(--blue-ink);font-weight:800;font-size:15px;
  display:flex;align-items:center;gap:10px;white-space:nowrap;transition:transform .15s}
#go:active{transform:scale(.96)}
#go .pr{font-variation-settings:"wdth" 125}
#go .fill{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left;opacity:.45}
#go span{position:relative}

/* sukces */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:40px}
.badge{position:relative;width:120px;height:120px;margin-bottom:22px}
.badge svg{position:absolute;inset:0}
.spark{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;margin:-4px}
.done>*{flex:none}
.done h1{font-size:32px}
.done .ticket{width:100%;text-align:left;margin-top:18px}
.ghost{margin-top:16px;height:52px;width:100%;border-radius:18px;background:var(--card);font-weight:700}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

// przewija tylko pasek, nie cały ekran (scrollIntoView ruszał też rodzica)
function center(strip,el){
  const max=strip.scrollWidth-strip.clientWidth,to=Math.max(0,Math.min(max,el.offsetLeft-strip.clientWidth/2+el.offsetWidth/2)),from=strip.scrollLeft;
  if(RM||Math.abs(to-from)<1){strip.scrollLeft=to;return}
  const t0=performance.now(),f=t=>{const k=Math.min(1,(t-t0)/450),e=1-Math.pow(1-k,3);strip.scrollLeft=from+(to-from)*e;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f);
}
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
// sprężyna jako easing linear()
function springEase(stiff=180,damp=16){
  const pts=[];let x=0,v=0;const dt=1/60;let n=0;
  while(n<240){v+=(-stiff*(x-1)-damp*v)*dt;x+=v*dt;pts.push(+x.toFixed(4));n++;if(n>30&&Math.abs(x-1)<.001&&Math.abs(v)<.01)break}
  return {ease:"linear(0,"+pts.join(",")+")",ms:Math.round(pts.length*1000/60)};
}

// wolne godziny dla barbera w danym dniu (atrapa: część terminów zajęta losowo, ale powtarzalnie)
function freeSlots(bid,date,len){
  const out=[];const r=rng(bid+date.toDateString()+(S.salon?S.salon.id:""));
  const isToday=+date===+today;
  for(const [a,b] of HOURS[date.getDay()])for(let m=a;m+len<=b;m+=15){
    const busy=r()<.45;if(busy)continue;if(isToday&&m<nowMin()+30)continue;out.push(m)}
  return out;
}
function slotsFor(date){
  const len=length();
  if(S.svc&&S.svc.junior)return freeSlots("junior",date,len).map(m=>({m,b:"junior"}));
  if(S.barber&&S.barber!=="any")return freeSlots(S.barber,date,len).map(m=>({m,b:S.barber}));
  const map=new Map();
  for(const b of BARBERS)for(const m of freeSlots(b.id,date,len))if(!map.has(m))map.set(m,b.id);
  return [...map].sort((a,b)=>a[0]-b[0]).map(([m,b])=>({m,b}));
}
function firstFree(bid){
  const len=length()||45;
  for(let i=0;i<14;i++){const d=new Date(today);d.setDate(d.getDate()+i);const f=freeSlots(bid,d,len);
    if(f.length)return (i===0?"dziś ":i===1?"jutro ":d.toLocaleDateString("pl-PL",{weekday:"short"})+" ")+hm(f[0])}
  return "brak terminów";
}
function openState(){
  const d=new Date(),w=HOURS[d.getDay()],m=nowMin();
  for(const [a,b] of w)if(m>=a&&m<b)return {open:1,t:"Otwarte · do "+hm(b)};
  const next=w.find(([a])=>a>m);if(next)return {open:0,t:"Otwarcie o "+hm(next[0])};
  return {open:0,t:"Teraz zamknięte"};
}

/* ---------- ekran: termin ---------- */
function timeScreen(){
  const b=BARBERS.find(x=>x.id===S.barber);
  const el=h(`<div><h1>Wybierz termin</h1><p class="sub">${b?b.n:S.barber==="junior"?"Junior Barber":"Dowolny barber"} · ${dur(length())}</p>
    <div class="mon"><b></b><span class="sub" style="margin:0;font-size:13px">Pn–Pt 10–20 · Sob 9–17</span></div>
    <div class="wk"><button class="arr" data-d="-1" aria-label="Poprzedni tydzień"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="days"><span id="dayInd"></span></div>
      <button class="arr" data-d="1" aria-label="Następny tydzień"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></div>
    <div class="slotbox"></div></div>`);
  const days=el.querySelector(".days"),box=el.querySelector(".slotbox"),mon=el.querySelector(".mon b"),ind=days.querySelector("#dayInd");
  // 3 tygodnie po 7 dni, strony przełączane strzałkami (bez przewijania paska)
  const list=[];for(let i=0;i<21;i++){const d=new Date(today);d.setDate(d.getDate()+i);list.push(d)}
  if(!S.day){S.day=list.find(d=>slotsFor(d).length)||list[0]}
  let idx=list.findIndex(d=>+d===+S.day);if(idx<0){idx=0;S.day=list[0]}
  let page=Math.floor(idx/7);
  const arrs=el.querySelectorAll(".arr");
  function render(dir=0){
    days.querySelectorAll(".day").forEach(x=>x.remove());
    list.slice(page*7,page*7+7).forEach((d,k)=>{const i=page*7+k;
      const closed=!HOURS[d.getDay()].length;
      const btn=h(`<button class="day${closed?" x":""}${i===idx?" on":""}"><span class="dw">${i===0?"dziś":d.toLocaleDateString("pl-PL",{weekday:"short"}).replace(".","")}</span><span class="dn">${d.getDate()}</span></button>`);
      btn.onclick=()=>{const dir=i>idx?1:-1;idx=i;S.day=d;S.slot=null;days.querySelectorAll(".day").forEach(x=>x.classList.toggle("on",x===btn));moveInd(true);slots(dir);bar()};
      days.appendChild(btn)});
    arrs[0].disabled=page===0;arrs[1].disabled=page===2;
    mon.textContent=list[page*7].toLocaleDateString("pl-PL",{month:"long",year:"numeric"});
    if(dir)stagger(days.querySelectorAll(".day"),[{opacity:0,transform:`translateX(${dir*30}px)`},{opacity:1,transform:"none"}],22);
    moveInd(false);
  }
  arrs.forEach(a=>a.onclick=()=>{const d=+a.dataset.d;const np=page+d;if(np<0||np>2)return;page=np;render(d)});
  function moveInd(animate){
    const on=Math.floor(idx/7)===page?days.querySelectorAll(".day")[idx%7]:null;
    if(!on){ind.style.opacity=0;return}
    const to=on.offsetLeft+"px",was=ind.style.opacity==="1";ind.style.width=on.offsetWidth+"px";ind.style.opacity=1;
    if(animate&&was&&ind.style.left)anim(ind,[{left:ind.style.left},{left:to}]);ind.style.left=to;
    mon.textContent=S.day.toLocaleDateString("pl-PL",{month:"long",year:"numeric"});
  }
  function slots(dir=0){
    box.innerHTML="";
    if(!HOURS[S.day.getDay()].length){box.appendChild(h(`<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#e5322d" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></svg><b>Niedziela — zamknięte</b>Wybierz inny dzień.</div>`))}
    else{
      const all=slotsFor(S.day);
      if(!all.length)box.appendChild(h(`<div class="empty"><b>Brak wolnych terminów</b>Wybierz inny dzień albo innego barbera.</div>`));
      if(all.length)wheel(all);
    }
    if(box.querySelector(".wheel")){anim(box.firstChild,[{opacity:0,transform:`translateX(${dir*40}px) translateY(${dir?0:20}px)`},{opacity:1,transform:"none"}]);return}
    const kf=[{opacity:0,transform:`translateX(${dir*40}px) translateY(${dir?0:20}px)`},{opacity:1,transform:"none"}];
    stagger(box.querySelectorAll(".grp,.slot,.empty"),kf,14);
  }
  // bęben: przeciągasz palcem, godziny obracają się po walcu, środkowa jest wybrana; każdy przeskok tyka jak w iOS
  function wheel(all){
    const H=46,w=h(`<div class="wheel"><div class="wb"></div><span class="wq">${all.length} wolnych</span><span class="wp"></span><div class="wl"></div></div>`);
    const wl=w.querySelector(".wl"),wp=w.querySelector(".wp");
    const items=all.map(x=>{const e=h(`<div class="wi">${hm(x.m)}</div>`);wl.appendChild(e);return e});
    let v=Math.max(0,all.findIndex(x=>S.slot&&x.m===S.slot.m)),last=-1,raf=0;
    const part=m=>m<720?"rano":m<1020?"popołudnie":"wieczór";
    function draw(){const c=Math.round(v);
      items.forEach((e,i)=>{const d=i-v,a=Math.max(-90,Math.min(90,d*21));
        e.style.transform=`rotateX(${-a}deg) translateZ(110px)`;e.style.opacity=Math.abs(d)>4?0:1-Math.abs(d)*.2;e.classList.toggle("on",i===c)});
      if(c!==last){if(last>=0)tyk(2700,{db:-20});last=c;wp.textContent=part(all[c].m)}}
    function pick(){const c=Math.round(v);if(!S.slot||S.slot.m!==all[c].m){S.slot=all[c];bar()}}
    function to(t,ms=420){cancelAnimationFrame(raf);t=Math.max(0,Math.min(all.length-1,t));const v0=v,t0=performance.now();
      const st=n=>{const q=Math.min(1,(n-t0)/ms),e=1-Math.pow(1-q,3);v=v0+(t-v0)*e;draw();if(q<1)raf=requestAnimationFrame(st);else{v=t;draw();pick();bloop(nuta(7),{db:-12})}};raf=requestAnimationFrame(st)}
    let y0=0,vs=0,ys=[];
    w.addEventListener("pointerdown",e=>{cancelAnimationFrame(raf);w.setPointerCapture(e.pointerId);y0=e.clientY;vs=v;ys=[[e.timeStamp,e.clientY]];w.style.cursor="grabbing"});
    w.addEventListener("pointermove",e=>{if(!w.hasPointerCapture(e.pointerId))return;v=Math.max(-.4,Math.min(all.length-.6,vs-(e.clientY-y0)/H));draw();ys.push([e.timeStamp,e.clientY]);if(ys.length>6)ys.shift()});
    w.addEventListener("pointerup",e=>{w.style.cursor="";const moved=Math.abs(e.clientY-y0)>4;
      if(!moved){const r=w.getBoundingClientRect(),d=Math.round((e.clientY-r.top-r.height/2)/H*.95);to(Math.round(v)+d);return}
      const [a,b]=[ys[0],ys[ys.length-1]],vel=b[0]>a[0]?(b[1]-a[1])/(b[0]-a[0]):0;   // px/ms
      to(Math.round(v-vel*180/H),Math.min(900,380+Math.abs(vel)*260))});
    let wt=0;w.addEventListener("wheel",e=>{e.preventDefault();cancelAnimationFrame(raf);v=Math.max(0,Math.min(all.length-1,v+e.deltaY/H/2));draw();clearTimeout(wt);wt=setTimeout(()=>to(Math.round(v)),120)},{passive:false});
    box.appendChild(w);draw();pick();
  }
  el.enter=()=>{render();stagger(el.querySelectorAll("h1,.sub,.mon,.wk"),POP,40);slots()};
  return el;
}

// wjazd karty: karta wyjeżdża od dołu, moduły QR zapalają się falą, po karcie przechodzi błysk
function passIn(t,delay){
  anim(t,[{opacity:0,transform:"translateY(70px) rotateX(22deg) scale(.92)"},{opacity:1,transform:"none"}],{delay,easing:SPsoft.ease,duration:SPsoft.ms});
  stagger(t.querySelectorAll(".ps-h,.ps-big,.ps-r,.ps-q"),[{opacity:0,transform:"translateY(12px)"},{opacity:1,transform:"none"}],60,{delay:delay+180});
  t.querySelectorAll(".ps-q rect").forEach(r=>{const x=+r.getAttribute("x"),y=+r.getAttribute("y");
    r.animate([{opacity:0},{opacity:1}],{duration:160,delay:delay+520+(x+y)*14,fill:"both"})});
  setTimeout(()=>t.classList.add("shine"),delay);
  bloop(nuta(9),{at:(delay+520)/1000,db:-12});snd("swish2",{at:(delay+250)/1000,db:-18,szczyt:true});
  for(let i=0;i<5;i++)tyk(3000+i*180,{at:(delay+560+i*130)/1000,db:-24});
}
function summaryScreen(){
  const el=h(`<div><h1>Sprawdź rezerwację</h1><p class="sub">Wszystko się zgadza? Kliknij „Umów wizytę”.</p>${ticket()}
    <p class="rules">Nie możesz przyjść? Odwołaj albo przełóż wizytę wcześniej: wystarczy SMS lub telefon. Nieodwołana wizyta trafia na czarną listę salonu.</p></div>`);
  el.enter=()=>{stagger(el.querySelectorAll("h1,.sub"),POP,60);
    passIn(el.querySelector(".ticket"),120);
    anim(el.querySelector(".rules"),POP,{delay:300})};
  return el;
}

/* ---------- ekran: sukces ---------- */
function doneScreen(){
  const el=h(`<div class="done"><div class="badge">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#61ccf0" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" class="c"/>
      <path d="M38 62l15 15 30-32" fill="none" stroke="#61ccf0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" class="k"/></svg></div>
    <h1>Do zobaczenia!</h1><p class="sub" style="margin:0">Wizyta zapisana.</p>${ticket()}
    <button class="ghost">Umów kolejną wizytę</button></div>`);
  el.querySelector(".ghost").onclick=()=>{Object.assign(S,{svc:null,barber:null,day:null,slot:null});go(0,-1)};
  el.enter=()=>{
    const badge=el.querySelector(".badge");
    anim(badge,[{transform:"scale(.3)",opacity:0},{transform:"none",opacity:1}]);
    anim(el.querySelector(".c"),[{strokeDashoffset:1},{strokeDashoffset:0}],{duration:600,easing:"cubic-bezier(.6,0,.2,1)"});
    anim(el.querySelector(".k"),[{strokeDashoffset:1},{strokeDashoffset:0}],{duration:420,delay:420,easing:"cubic-bezier(.4,0,.2,1)"});
    const cols=["#61ccf0","#f3f5f6","#ec6a3c"];
    for(let i=0;i<18;i++){const sp=h(`<span class="spark" style="background:${cols[i%3]}"></span>`);badge.appendChild(sp);
      const a=i/18*Math.PI*2,r=78+Math.random()*30;
      anim(sp,[{transform:"translate(0,0) scale(0)",opacity:1},{transform:`translate(${Math.cos(a)*r*.7}px,${Math.sin(a)*r*.7}px) scale(1.2)`,opacity:1,offset:.5},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(0)`,opacity:0}],{duration:900,delay:500,easing:"cubic-bezier(.2,.8,.3,1)"})}
    stagger(el.querySelectorAll("h1,.sub,.ghost"),POP,80,{delay:500});passIn(el.querySelector(".ticket"),660);
    navigator.vibrate&&navigator.vibrate([12,40,18]);
  };
  return el;
}

/* ---------- start: splash ---------- */
(function splash(){
  const sp=$("#splash"),tag=$("#tag");
  "JAKOŚĆ PONAD ILOŚĆ".split(" ").forEach(w=>tag.appendChild(h(`<span>${w}</span>`)));
  let gone=false;
  const end=()=>{if(gone)return;gone=true;
    anim(sp,[{opacity:1,transform:"scale(1)"},{opacity:0,transform:"scale(1.15)"}],{duration:450,easing:"cubic-bezier(.4,0,.2,1)"}).finished.then(()=>sp.remove());
    go(0)};
  sp.onclick=end;
  anim(sp.querySelector("img"),[{opacity:0,transform:"scale(.6)",filter:"blur(14px)"},{opacity:1,transform:"none",filter:"blur(0)"}],{easing:SPsoft.ease,duration:SPsoft.ms});
  stagger(tag.children,[{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}],110,{delay:450});
  setTimeout(end,RM?300:1900);
})();
